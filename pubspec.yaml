name: stocksaathi
description: Stock register for mobile accessory shops. Quantity only, no money fields.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Pinned loosely on purpose: the caret keeps each package inside the major
  # version whose API this code is written against.
  intl: any
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  iconsax_flutter: ^1.0.1
  pdf: ^3.10.0
  excel: ^4.0.0
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  google_sign_in: ^6.2.1
  http: ^1.2.0
  uuid: ^4.3.3
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # The Devanagari font is fetched by CI into this folder before the build.
    # If it is absent the PDF generator falls back to the built-in font.
    - assets/fonts/
